packages:
  - apps/*
  - packages/*

# Paket yang diizinkan menjalankan postinstall (pnpm memblokir skrip build secara default).
minimumReleaseAgeExclude:
  - '@nestjs/cli@12.0.13'
  - lucide-react@1.73.0
  - '@eslint/config-array@0.23.6'
  - eslint@10.15.0

# Paket yang diizinkan menjalankan skrip instalasi (pnpm 12: allowBuilds).
allowBuilds:
  '@prisma/engines': true
  '@swc/core': true
  '@tailwindcss/oxide': true
  esbuild: true
  prisma: true
  sharp: true
